[package]
name = "file-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
rfd = "0.15.4"
tempfile = "3"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
url = "2.5"

[dev-dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
